[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth-finetuning-sriram"
version = "0.2.1"
description = "Professional Enterprise Pipeline for Unsloth LLM Finetuning with LoRA, TRL, and modular architecture"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Sriram Dayal", email = "your.email@example.com"}
]
maintainers = [
    {name = "Sriram Dayal", email = "your.email@example.com"}
]
keywords = [
    "llm", "finetuning", "unsloth", "lora", "qlora",
    "machine-learning", "transformers", "peft", "trl",
    "quantization", "deep-learning", "nlp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
]

dependencies = [
    "torch==2.5.1",
    "transformers>=4.47.0",
    "datasets>=2.14.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=1.1.0",
    "huggingface-hub>=0.19.0",
    "pyyaml>=6.0",
    "pandas>=1.5.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
unsloth = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git ; sys_platform == 'linux'",
]

# ── Platform-specific GPU backends ────────────────────────────────────────

# Windows NVIDIA: llama.cpp CUBLAS + bitsandbytes QLoRA (no Triton / WSL needed)
# Install: uv pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
windows = [
    "llama-cpp-python>=0.3.0",
]

# Linux NVIDIA: full Unsloth Triton kernels (2× speed, 70% less VRAM)
# Install: pip install unsloth-finetuning[linux]
linux = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git ; sys_platform == 'linux'",
    "llama-cpp-python>=0.3.0",
    "triton>=2.1.0; sys_platform == 'linux'",
]

# macOS Apple Silicon: MPS training + Metal GGUF inference
# Install: CMAKE_ARGS='-DGGML_METAL=on' pip install llama-cpp-python
#          then: pip install unsloth-finetuning[macos]
macos = [
    "llama-cpp-python>=0.3.0",
]

# CPU-only: no GPU required (slow, for testing / non-GPU machines)
cpu = [
    "llama-cpp-python>=0.3.0",
]

dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "twine>=4.0.0",
    "build>=1.0.0",
]

gui = [
    "gradio>=4.0.0",
]

gpu = [
    "nvidia-cuda-runtime-cu12>=12.1.0; sys_platform != 'darwin'",
    "nvidia-cuda-cupti-cu12>=12.1.0; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=8.9.0; sys_platform != 'darwin'",
    "nvidia-cublas-cu12>=12.1.0; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12>=12.1.0; sys_platform != 'darwin'",
    "nvidia-curand-cu12>=10.3.2; sys_platform != 'darwin'",
    "nvidia-cusolver-cu12>=11.4.5; sys_platform != 'darwin'",
    "nvidia-cusparse-cu12>=12.1.0; sys_platform != 'darwin'",
    "nvidia-nccl-cu12>=2.18.1; sys_platform == 'linux'",
    "nvidia-nvtx-cu12>=12.1.0; sys_platform != 'darwin'",
]

# Legacy Linux/Unsloth full install
all = [
    "unsloth-finetuning-sriram[dev,gui,gpu,linux]",
]

# Platform meta-extras
all-windows = [
    "unsloth-finetuning-sriram[dev,gui,windows]",
]
all-linux = [
    "unsloth-finetuning-sriram[dev,gui,linux]",
]
all-macos = [
    "unsloth-finetuning-sriram[dev,gui,macos]",
]
all-cpu = [
    "unsloth-finetuning-sriram[dev,gui,cpu]",
]

[project.urls]
Homepage = "https://github.com/Sriramdayal/Unsloth-LLM-finetuningv1"
Documentation = "https://github.com/Sriramdayal/Unsloth-LLM-finetuningv1/blob/main/documentation.md"
Repository = "https://github.com/Sriramdayal/Unsloth-LLM-finetuningv1"
Issues = "https://github.com/Sriramdayal/Unsloth-LLM-finetuningv1/issues"
Changelog = "https://github.com/Sriramdayal/Unsloth-LLM-finetuningv1/blob/main/CHANGELOG.md"
"Unsloth Official" = "https://github.com/unslothai/unsloth"

[project.scripts]
unsloth-cli = "src.cli:main"
unsloth-gui = "scripts.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
src = ["*.yaml", "configs/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.uv]
managed = true
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
torchaudio = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
