name: Python Package

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Lint with black (check mode)
      run: uv run black --check src/ scripts/

    - name: Sort imports check
      run: uv run isort --check-only src/ scripts/

    - name: Verify Package Import
      run: uv run python -c "import src; print(f'Package v{src.__version__} imported successfully')"

    - name: Run Smoke Test
      run: uv run python scripts/smoke_test.py
